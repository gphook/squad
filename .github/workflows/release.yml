name: Release

# Publishes @gphook/squad when a v* tag is pushed. Uses npm trusted publishing (GitHub OIDC): no token is stored.
# One-time setup is in CONTRIBUTING.md ("Releasing").
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5 or later. Pinned to a major so a new npm can't change a release unannounced.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Tag matches the version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version: bump the version or fix the tag."
            exit 1
          fi
      - run: npm run package
      - run: npm run smoke
      - run: npm publish --provenance --access public
        working-directory: release
