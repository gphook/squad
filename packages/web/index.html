<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Squad</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17171a" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply a chosen light/dark theme before first paint, so the page doesn't flash (see src/lib/theme.ts).
      try {
        const t = localStorage.getItem("squad.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
